# Push a tag like v1.0.0 and this makes a GitHub release (or refreshes its files if it exists) with two packages:
# the normal one (with the tools/perf diagnostics), the lean one (tools/lean/build.sh),
# and a zip of the shell scripts and config files. It also updates the Homebrew Channel
# repository on GitHub Pages (tools/hbrepo/make-repo.js), so TVs that added it get the update.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @webos-tools/cli
      - name: Build both packages
        run: |
          set -e
          V=$(node -p "require('./appinfo.json').version")
          # the tag must match appinfo.json, or the packages (and the Homebrew Channel) keep the old version
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match appinfo.json version $V"; exit 1; }
          mkdir -p ../full/web-osome ../dist
          git archive HEAD | tar -x -C ../full/web-osome
          (cd ../full && ares-package -o out web-osome web-osome/service)
          sh tools/lean/build.sh ../lean/web-osome
          mv ../full/out/net.local.tvhome_${V}_all.ipk ../dist/net.local.tvhome_${V}_all.ipk
          mv ../lean/net.local.tvhome_${V}_all.ipk ../dist/net.local.tvhome_${V}_all-lean.ipk
          # the scripts and config that also run from a computer or Home Assistant
          git archive --format=zip -o ../dist/tvhome-${V}-scripts-and-config.zip HEAD startup home-assistant tools/perf service/services.json service/package.json appinfo.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # moved a tag that already has a release (git push -f origin <tag>): replace its files
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" ../dist/* --clobber; exit 0; fi
          gh release create "$GITHUB_REF_NAME" ../dist/* --title "TV Home $GITHUB_REF_NAME" --notes "- \`net.local.tvhome_*_all.ipk\`: normal build, with the diagnostics for tools/perf.
          - \`net.local.tvhome_*_all-lean.ipk\`: lean build, no diagnostics, tools or docs.
          - \`tvhome-*-scripts-and-config.zip\`: startup scripts, Home Assistant config, perf tools and app/service config, to use from a computer.

          Both are the same app, so installing one replaces the other."
      - name: Make the Homebrew Channel repository
        run: node tools/hbrepo/make-repo.js ../dist "$RUNNER_TEMP/hbrepo" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/hbrepo
  # needs Settings > Pages > Source: GitHub Actions (once)
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
