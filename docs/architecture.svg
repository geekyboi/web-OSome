<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-label="TV Home architecture: the TV Home app talks to the TV Home service and to webOS system services over Luna; the service polls a MusicCast amp, Home Assistant, Open-Meteo and calendar feeds; the phone editor reaches the service over HTTP on port 8419.">
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#16202a}
.t{font-size:13px;font-weight:600}.h{font-size:15px;font-weight:700}
.s,.lbl{font-size:11px;fill:#5b6875}.m{font-family:Menlo,Consolas,monospace;font-size:10.5px;fill:#5b6875}
.grp{font-size:12px;font-weight:600;fill:#5b6875;letter-spacing:.06em}
.tv{fill:none;stroke:#16202a;stroke-width:1.5}.zone{fill:none;stroke:#c9d1d9;stroke-width:1.2}
.app{fill:#e3f0f5;stroke:#1b6a8a;stroke-width:1.6}.sys{fill:#eceff3;stroke:#5b6875;stroke-width:1.2}
.ext{fill:#fbefe3;stroke:#a3591a;stroke-width:1.6}.row{fill:#fff;stroke:#c9d1d9;stroke-width:1}
.root{stroke-dasharray:6 4}.ppl{fill:#fff;stroke:#16202a;stroke-width:1.2}
.ar{fill:none;stroke:#5b6875;stroke-width:1.5}.ar.a{stroke:#1b6a8a}.ar.e{stroke:#a3591a}
.hd{fill:#5b6875}.hd.a{fill:#1b6a8a}.hd.e{fill:#a3591a}
</style>
<rect x="0" y="0" width="1280" height="830" fill="#ffffff"/>

    <defs>
      <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd a" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="he" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd e" d="M0,0 L10,5 L0,10 z"/></marker>
    </defs>

    <!-- people -->
    <rect class="ppl" x="20" y="120" width="180" height="70" rx="8"/>
    <text class="t" x="34" y="148">Remote</text>
    <text class="s" x="34" y="166">arrows, OK, Back, red,</text>
    <text class="s" x="34" y="180">Magic Remote pointer</text>

    <rect class="ppl root" x="20" y="520" width="180" height="80" rx="8"/>
    <text class="t" x="34" y="548">Phone or laptop</text>
    <text class="s" x="34" y="566">layout editor in a browser,</text>
    <text class="s" x="34" y="580">signs in with the TV's QR code</text>

    <!-- TV boundary -->
    <text class="grp" x="230" y="28">LG webOS TV · OLED55A2, webOS 23</text>
    <rect class="tv" x="230" y="40" width="735" height="770" rx="12"/>

    <!-- TV Home app -->
    <rect class="app" x="260" y="70" width="330" height="256" rx="9"/>
    <text class="h" x="276" y="96">TV Home app</text>
    <text class="m" x="276" y="113">net.local.tvhome · HTML, CSS, ES5</text>
    <rect class="row" x="276" y="128" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="144">Launcher core</text><text class="s" x="288" y="159">dock, layout, actions, glass panels, idle dim</text>
    <rect class="row" x="276" y="176" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="192">Plugin tiles</text><text class="s" x="288" y="207">clock, greeting, weather, calendar, bins, music</text>
    <rect class="row" x="276" y="224" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="240">Settings screen</text><text class="s" x="288" y="255">red button: add apps, inputs and tiles</text>
    <rect class="row" x="276" y="272" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="288">config.js + local storage</text><text class="s" x="288" y="303">defaults, and settings when there's no service</text>

    <!-- TV Home service -->
    <rect class="app root" x="260" y="470" width="330" height="302" rx="9"/>
    <text class="h" x="276" y="496">TV Home service</text>
    <text class="m" x="276" y="513">net.local.tvhome.service · Node · root</text>
    <rect class="row" x="276" y="528" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="544">Luna methods</text><text class="s" x="288" y="559">getLayout, getPlugins, plugin topics, activity</text>
    <rect class="row" x="276" y="576" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="592">Web server, port 8419</text><text class="s" x="288" y="607">phone editor and its API, album art</text>
    <rect class="row" x="276" y="624" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="640">Plugin back ends</text><text class="s" x="288" y="655">weather, calendar, bins, now playing</text>
    <rect class="row" x="276" y="672" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="688">Power gate</text><text class="s" x="288" y="703">timers pause when TV is off or an app is up</text>
    <rect class="row" x="276" y="720" width="298" height="40" rx="5"/>
    <text class="t" x="288" y="736">Saved layout and secrets</text><text class="m" x="288" y="751">/home/root/.config/tvhome/</text>

    <!-- webOS system services -->
    <rect class="sys" x="660" y="70" width="280" height="256" rx="9"/>
    <text class="h" x="676" y="96">webOS system services</text>
    <text class="m" x="676" y="113">luna://com.webos.*</text>
    <rect class="row" x="676" y="128" width="248" height="40" rx="5"/>
    <text class="t" x="688" y="144">applicationManager</text><text class="s" x="688" y="159">launch, list apps, foreground app</text>
    <rect class="row" x="676" y="176" width="248" height="40" rx="5"/>
    <text class="t" x="688" y="192">tvpower · audio</text><text class="s" x="688" y="207">power state, volume and mute keys</text>
    <rect class="row" x="676" y="224" width="248" height="40" rx="5"/>
    <text class="t" x="688" y="240">eim (external inputs)</text><text class="s" x="688" y="255">HDMI list; adds TV Home as an input</text>
    <rect class="row root" x="676" y="272" width="248" height="40" rx="5"/>
    <text class="t" x="688" y="288">Homebrew Channel exec</text><text class="s" x="688" y="303">fixed root commands: real app icons</text>

    <!-- started outside the app -->
    <rect class="sys root" x="660" y="470" width="280" height="156" rx="9"/>
    <text class="h" x="676" y="496">Started outside the app</text>
    <text class="s" x="676" y="513">rooted TVs, via the Homebrew Channel</text>
    <rect class="row" x="676" y="528" width="248" height="40" rx="5"/>
    <text class="t" x="688" y="544">autostart.sh (init.d)</text><text class="s" x="688" y="559">opens TV Home at power-on and wake</text>
    <rect class="row" x="676" y="576" width="248" height="40" rx="5"/>
    <text class="t" x="688" y="592">LG Input Hook</text><text class="s" x="688" y="607">remote's Home key opens TV Home</text>

    <!-- outside zones -->
    <rect class="zone" x="1000" y="40" width="260" height="360" rx="10"/>
    <text class="grp" x="1012" y="390">HOME NETWORK</text>
    <rect class="zone" x="1000" y="420" width="260" height="390" rx="10"/>
    <text class="grp" x="1012" y="800">INTERNET</text>

    <rect class="ext" x="1010" y="80" width="240" height="124" rx="8"/>
    <text class="t" x="1024" y="104">Home Assistant</text>
    <text class="s" x="1024" y="122">tile webhooks, sent by the app</text>
    <text class="s" x="1024" y="137">extra-apps list (tvhome-apps.js)</text>
    <text class="s" x="1024" y="152">bin days: /api/states, /api/calendars</text>
    <text class="m" x="1024" y="190">bins: every 30 min</text>

    <rect class="ext" x="1010" y="236" width="240" height="132" rx="8"/>
    <text class="t" x="1024" y="260">Yamaha MusicCast amp</text>
    <text class="s" x="1024" y="278">what's playing: Spotify, AirPlay,</text>
    <text class="s" x="1024" y="293">radio, CD… plus art and play/pause</text>
    <text class="m" x="1024" y="311">/YamahaExtendedControl/v1</text>
    <text class="m" x="1024" y="352">3 s playing, 8 s idle</text>

    <rect class="ext" x="1010" y="450" width="240" height="120" rx="8"/>
    <text class="t" x="1024" y="474">Open-Meteo</text>
    <text class="s" x="1024" y="492">forecast and place lookup,</text>
    <text class="s" x="1024" y="507">no key needed</text>
    <text class="m" x="1024" y="556">every 15 min</text>

    <rect class="ext" x="1010" y="600" width="240" height="120" rx="8"/>
    <text class="t" x="1024" y="624">Calendar feeds</text>
    <text class="s" x="1024" y="642">private .ics links</text>
    <text class="s" x="1024" y="657">(Google, iCloud, Outlook…)</text>
    <text class="m" x="1024" y="706">every 15 min</text>

    <!-- arrows: people -->
    <line class="ar" x1="200" y1="155" x2="256" y2="155" marker-end="url(#h)"/>
    <text class="lbl" x="228" y="147" text-anchor="middle">keys</text>
    <line class="ar" x1="200" y1="560" x2="256" y2="560" marker-end="url(#h)"/>
    <text class="lbl" x="228" y="552" text-anchor="middle">HTTP</text>

    <!-- app <-> service -->
    <line class="ar a" x1="360" y1="330" x2="360" y2="466" marker-start="url(#ha)" marker-end="url(#ha)"/>
    <text class="lbl" x="370" y="384">luna:// calls and</text>
    <text class="lbl" x="370" y="398">subscriptions: layout,</text>
    <text class="lbl" x="370" y="412">tile data, now playing</text>
    <line class="ar a" x1="510" y1="326" x2="510" y2="466" marker-end="url(#ha)"/>
    <text class="lbl" x="518" y="384">HTTP to</text>
    <text class="m" x="518" y="398">127.0.0.1:8419</text>
    <text class="lbl" x="518" y="412">art, images</text>

    <!-- app -> system -->
    <line class="ar" x1="590" y1="148" x2="656" y2="148" marker-end="url(#h)"/>
    <text class="lbl" x="624" y="141" text-anchor="middle">launch</text>
    <line class="ar" x1="590" y1="244" x2="656" y2="244" marker-end="url(#h)"/>
    <text class="lbl" x="624" y="237" text-anchor="middle">inputs</text>
    <line class="ar root" x1="590" y1="292" x2="656" y2="292" marker-end="url(#h)"/>
    <text class="lbl" x="624" y="285" text-anchor="middle">icons</text>

    <!-- service -> system -->
    <path class="ar" d="M590,600 H628 V350 H720 V330" marker-end="url(#h)"/>
    <text class="lbl" x="638" y="384">subscribes to power,</text>
    <text class="lbl" x="638" y="398">foreground app, volume;</text>
    <text class="lbl" x="638" y="412">reopens TV Home on Back</text>

    <!-- started outside -> system -->
    <line class="ar root" x1="880" y1="470" x2="880" y2="330" marker-end="url(#h)"/>
    <text class="lbl" x="872" y="440" text-anchor="end">luna-send</text>
    <text class="lbl" x="872" y="454" text-anchor="end">launch</text>

    <!-- app -> Home Assistant -->
    <path class="ar e" d="M550,70 V58 H1110 V76" marker-end="url(#he)"/>
    <text class="lbl" x="760" y="52" text-anchor="middle">webhooks and extra-apps list, straight from the app</text>

    <!-- service -> outside (trunk) -->
    <path class="ar e" d="M430,772 V792 H985 V160"/>
    <text class="lbl" x="600" y="787">service fetches everything else (Node http/https)</text>
    <line class="ar e" x1="985" y1="160" x2="1006" y2="160" marker-end="url(#he)"/>
    <line class="ar e" x1="985" y1="320" x2="1006" y2="320" marker-end="url(#he)"/>
    <line class="ar e" x1="985" y1="510" x2="1006" y2="510" marker-end="url(#he)"/>
    <line class="ar e" x1="985" y1="660" x2="1006" y2="660" marker-end="url(#he)"/>
  </svg>
