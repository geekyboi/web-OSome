<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b10">
<title>TV Home</title>
<link rel="stylesheet" href="/editor.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>TV Home</div>
    <span id="status" class="status" role="status"></span>
    <button id="save" class="btn primary" type="button" disabled>Save</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="home" aria-selected="true">Home screen</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <main>
    <section id="tab-home" class="tabpane"></section>
    <section id="tab-settings" class="tabpane" hidden></section>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-back" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
      <div id="sheet-foot" class="sheet-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/bgdraw.js"></script>
  <!-- the editor: plain scripts sharing one scope, in this order -->
  <script src="/editor/util.js"></script>
  <script src="/editor/state.js"></script>
  <script src="/editor/tiles.js"></script>
  <script src="/editor/home-tab.js"></script>
  <script src="/editor/sheet.js"></script>
  <script src="/editor/add-apps.js"></script>
  <script src="/editor/edit-app.js"></script>
  <script src="/editor/uploads.js"></script>
  <script src="/editor/plugins.js"></script>
  <script src="/editor/settings-tab.js"></script>
  <script src="/editor/sync.js"></script>
  <script src="/editor/main.js"></script>
</body>
</html>
